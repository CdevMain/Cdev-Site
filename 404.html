<!DOCTYPE html>
<html lang="pt-BR" class="cdev-admin">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Página não encontrada</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/admin-fluid.css?v=20261001" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080e10; --bg2: #0c1518; --border: rgba(30,98,117,.18);
      --text: #e8f2f5; --muted: #4a6570; --accent: #1e6275; --al: #2b8ba5;
      --fd: 'Syne', sans-serif; --fm: 'DM Mono', monospace;
    }
        body {
      background: var(--bg); color: var(--text); font-family: var(--fd);
      overflow-x: hidden; margin: 0; cursor: none;
    }
    body, body * { cursor: none; }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity: .5;
    }

    @media (pointer: coarse) {
      body, body * { cursor: auto; }
      #cur { display: none; }
    }

    #cur { position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none; }
    #cdot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--al);
      position: absolute; transform: translate(-50%,-50%);
      transition: width .15s, height .15s;
      box-shadow: 0 0 12px var(--al);
    }
    #cring {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1.5px solid var(--accent);
      position: absolute; transform: translate(-50%,-50%);
      transition: width .25s, height .25s, opacity .25s;
      opacity: .4;
    }
    body.hov #cdot {
      width: 14px;
      height: 14px;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255,255,255,.9);
    }
    body.hov #cring {
      width: 58px;
      height: 58px;
      opacity: .7;
      border-color: #ffffff;
    }
    body.down #cdot { width: 6px; height: 6px; }
    body.down #cring { width: 28px; height: 28px; opacity: .9; border-color: var(--al); }

    .page-404 {
      position: relative; z-index: 2; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }

    .orb {
      position: absolute; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(30,98,117,.08) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      animation: pulse 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: .5; }
    }

    .content { position: relative; z-index: 1; max-width: 600px; }

    .error-code {
      font-family: var(--fm); font-size: 6rem; font-weight: 800;
      color: var(--accent); opacity: 0;
      animation: slidedown .8s .2s cubic-bezier(.34,.1,.68,1) forwards;
    }

    .error-title {
      font-size: 2.5rem; font-weight: 800; margin-top: 1rem;
      opacity: 0; animation: slidedown .8s .4s cubic-bezier(.34,.1,.68,1) forwards;
    }

    .error-subtitle {
      font-size: 1.1rem; color: var(--muted); margin: 1.5rem 0;
      opacity: 0; animation: slidedown .8s .6s cubic-bezier(.34,.1,.68,1) forwards;
    }

    @keyframes slidedown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .timer {
      font-family: var(--fm); font-size: .85rem; color: var(--muted); margin-top: 2rem;
      opacity: 0; animation: slidedown .8s .8s cubic-bezier(.34,.1,.68,1) forwards;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: .75rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
      opacity: 0;
      animation: slidedown .8s .7s cubic-bezier(.34,.1,.68,1) forwards;
    }
    .error-btn {
      font-family: var(--fm);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: .6rem 1rem;
      border-radius: 2px;
      transition: color .2s, border-color .2s, background .2s;
    }
    .error-btn:hover {
      color: var(--al);
      border-color: var(--al);
      background: rgba(30,98,117,.08);
    }
      /* Barra de rolagem CDEV */
    html, * { scrollbar-width: thin; scrollbar-color: #1e6275 #0a1215; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0a1215; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1e6275, #2b8ba5); border-radius: 999px; border: 2px solid #0a1215; }
    ::-webkit-scrollbar-thumb:hover { background: #2b8ba5; }
    ::-webkit-scrollbar-corner { background: #0a1215; }
</style>
</head>
<body data-error-code="404" data-redirect="/" data-redirect-seconds="10">
  <div id="cur"><div id="cring"></div><div id="cdot"></div></div>

  <div class="page-404">
    <div class="orb"></div>
    <div class="content">
      <div class="error-code" id="error-code">404</div>
      <h1 class="error-title" id="error-title">Página não encontrada</h1>
      <p class="error-subtitle" id="error-subtitle">Desculpe! A página que você está procurando não existe ou foi movida.</p>
      <div class="error-actions">
        <a class="error-btn" href="/" data-i="crumb-home">Home</a>
        <a class="error-btn" href="/#contact" data-i="nav-contact">Contato</a>
        <a class="error-btn" href="/community" data-i="nav-community">Comunidade</a>
      </div>
      <div class="timer">
        <span data-i="error-redirect">Redirecionando em</span> <span id="countdown">10</span>s...
      </div>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=20261008"></script>
  <script src="/assets/js/consent.js?v=20261007"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
