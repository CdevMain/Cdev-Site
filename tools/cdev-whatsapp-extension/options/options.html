<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDEV WhatsApp — Configurações</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="side">
        <div class="brand">
          <img src="../icons/icon48.png" alt="" width="32" height="32" />
          <div>
            <strong>CDEV WhatsApp</strong>
            <small id="version"></small>
          </div>
        </div>
        <nav id="nav"></nav>
        <a class="open-wa" href="https://web.whatsapp.com/" target="_blank" rel="noreferrer">Abrir WhatsApp Web</a>
      </aside>
      <main>
        <header class="topbar">
          <h1 id="section-title"></h1>
          <div class="topbar-actions">
            <span id="dirty" hidden>Alterações não salvas</span>
            <button type="button" class="btn ghost" id="discard" hidden>Descartar</button>
            <button type="button" class="btn primary" id="save">Salvar</button>
          </div>
        </header>
        <div id="conflicts" class="alert" hidden></div>
        <div id="content"></div>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <script src="../src/core/ns.js"></script>
    <script src="../src/core/icons.js"></script>
    <script src="../src/core/store.js"></script>
    <script src="../src/core/crm.js"></script>
    <script src="../src/core/writer.js"></script>
    <script src="../src/features/sound.js"></script>
    <script src="../lib/jspdf.umd.min.js"></script>
    <script src="../src/pdf/engine.js"></script>
    <script src="pdf-editor.js"></script>
    <script src="options.js"></script>
  </body>
</html>
