# CDEV - URLs limpas (sem .html)
#   /admin        -> serve admin.html
#   /admin.html   -> 301 para /admin  (mantem ?query; links antigos continuam funcionando)
#   /index.html   -> 301 para /
#
# Como usar (dentro do server { } do cdev.com.br que escuta 443, o que tem "root /var/www/cdev-site;"):
#   1. Copie este arquivo:  sudo cp /var/www/cdev-site/ops/nginx/clean-urls.conf /etc/nginx/snippets/cdev-clean-urls.conf
#   2. No server block, APAGUE o bloco "location / { ... }" existente (este arquivo ja define um)
#      e adicione a linha:   include snippets/cdev-clean-urls.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Obs.: se o seu "location /" atual tiver algo alem de try_files (proxy, auth, etc.), mantenha essas
#       linhas e troque apenas o try_files pelo daqui.

# Pastas internas do repositorio nunca sao servidas
location ~ ^/(supabase|ops|tools|docs|\.git)(/|$) { return 404; }

# Home
location = /index.html {
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }
}

# /pagina.html -> /pagina (somente quando o navegador pediu o .html; redirecionamentos internos, como error_page, passam direto)
location ~ ^/(?<cdev_page>[A-Za-z0-9_-]+)\.html$ {
    if ($request_uri ~ ^/[^?]*\.html(\?.*)?$) {
        return 301 /$cdev_page$1;
    }
    try_files $uri =404;
}

# /pagina -> pagina.html ; /pasta/ -> pasta/index.html
location / {
    try_files $uri $uri.html $uri/ =404;
}

# Pagina de erro propria (tambem com URL limpa)
error_page 404 /404.html;
