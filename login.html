<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDEV - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#080e10', ink2: '#0c1518', ink3: '#111d21', mist: '#e8f2f5', muted: '#4a6570', accent: '#1e6275', aqua: '#2b8ba5', line: 'rgba(30,98,117,.18)', lineStrong: 'rgba(30,98,117,.45)', faint: 'rgba(30,98,117,.07)' }, fontFamily: { display: ['Syne', 'sans-serif'], mono: ['DM Mono', 'monospace'] } } } };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      :root { --line: rgba(30,98,117,.18); --line-strong: rgba(30,98,117,.45); --faint: rgba(30,98,117,.07); --fd: 'Syne', sans-serif; --fm: 'DM Mono', monospace; }
      html { scroll-behavior: smooth; zoom: 1.25; }
      @supports not (zoom: 1) { html { font-size: 125%; } }
      body { @apply bg-ink text-mist font-display overflow-x-hidden; }
      body::before { content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E"); opacity: .5; }
    }
    @layer components {
      .nav-logo { display: flex; align-items: center; gap: .75rem; font-family: var(--fm); font-size: .82rem; letter-spacing: .2em; text-transform: uppercase; color: #2b8ba5; text-decoration: none; }
      .section-label { font-family: var(--fm); font-size: .7rem; color: #2b8ba5; letter-spacing: .22em; text-transform: uppercase; display: flex; align-items: center; gap: .75rem; }
      .section-label::before { content: ''; display: block; width: 28px; height: 1px; background: #2b8ba5; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: .6rem; padding: .9rem 1.2rem; border-radius: 2px; font-family: var(--fd); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; transition: all .25s; }
      .btn-primary { background: linear-gradient(135deg, #1e6275 0%, #2b8ba5 100%); color: #e8f2f5; border: 1px solid rgba(43,139,165,.35); }
      .field { width: 100%; border: 1px solid var(--line); background: rgba(12,21,24,.78); color: #e8f2f5; border-radius: 2px; padding: .85rem 1rem; font-family: var(--fm); font-size: .75rem; outline: none; }
      .field:focus { border-color: #2b8ba5; box-shadow: 0 0 0 3px rgba(43,139,165,.12); }
      .panel { border: 1px solid var(--line); background: rgba(12,21,24,.72); backdrop-filter: blur(18px); box-shadow: 0 20px 60px rgba(7,15,18,.55); border-radius: 8px; }
      .feedback { min-height: 1.25rem; font-family: var(--fm); font-size: .72rem; color: #4a6570; }
      .feedback[data-tone="success"] { color: #2b8ba5; }
      .feedback[data-tone="error"] { color: #e07b24; }
    }
  </style>
</head>
<body>
  <main class="relative z-10 min-h-screen px-6 py-8 lg:px-12">
    <nav class="mx-auto flex max-w-6xl items-center justify-between">
      <a class="nav-logo" href="index.html#hero">CDEV</a>
      <a class="font-mono text-[0.68rem] uppercase tracking-[0.18em] text-aqua hover:text-mist" href="index.html">Home</a>
    </nav>

    <section class="mx-auto grid min-h-[80vh] max-w-6xl items-center gap-10 lg:grid-cols-[1fr_0.82fr]">
      <div>
        <div class="section-label">Acesso seguro</div>
        <h1 class="mt-6 max-w-2xl text-[clamp(2.8rem,7vw,5.8rem)] font-extrabold leading-[0.93]">Painel<br><span class="text-transparent [-webkit-text-stroke:1px_rgba(232,242,245,.55)]">CDEV.</span></h1>
        <p class="mt-6 max-w-xl text-[0.98rem] leading-7 text-muted">Entre para acessar os modulos protegidos, dashboard e ferramentas administrativas.</p>
      </div>

      <form id="login-form" class="panel p-6">
        <div class="font-mono text-[0.68rem] uppercase tracking-[0.2em] text-aqua">Login</div>
        <label class="mt-6 block">
          <span class="mb-2 block font-mono text-[0.68rem] uppercase tracking-[0.16em] text-muted">Email</span>
          <input class="field" name="email" type="email" autocomplete="email" required />
        </label>
        <label class="mt-4 block">
          <span class="mb-2 block font-mono text-[0.68rem] uppercase tracking-[0.16em] text-muted">Senha</span>
          <input class="field" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary mt-6 w-full" type="submit">Entrar</button>
        <p id="login-feedback" class="feedback mt-4"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.config.js"></script>
  <script src="assets/js/cdev-auth.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
