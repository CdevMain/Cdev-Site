<body data-page="control">
  <div class="cc-shell">
    <aside class="cc-side" id="cdev-side"></aside>

    <main class="cc-main" data-auth-status>
      <header class="cc-top">
        <button class="icon-btn cc-menu-btn" id="menu-btn" type="button" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="cc-search">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="global-search" class="field" type="search" autocomplete="off" placeholder="Buscar cliente, empresa, domínio, telefone, e-mail, projeto...  ( / )" aria-label="Pesquisa global">
          <div id="search-results" class="cc-search-results panel" hidden></div>
        </div>
        <div class="cc-top-right">
          <span class="cc-user" id="cc-user"></span>
          <a class="icon-btn cc-bell" href="#/notificacoes" aria-label="Alertas"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot" id="bell-dot" hidden></span></a>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <div id="toast-region" aria-live="polite"></div>
